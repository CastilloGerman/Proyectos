@if (loadError()) {
  <div class="fab fab--error" role="alert">
    <span class="fab__muted">No se pudo cargar el plazo de presentación.</span>
  </div>
} @else if (visible()) {
  @if (data(); as d) {
    <div [class]="clase()" role="region" aria-label="Plazo del modelo 303">
      <mat-icon class="fab__icon" aria-hidden="true">calendar_month</mat-icon>
      <p class="fab__title">{{ texto(d) }}</p>
      <button type="button" class="fab__btn" (click)="ver()">Ver ese trimestre</button>
      <button type="button" class="fab__btn" (click)="ocultar()">Ocultar</button>
    </div>
  }
}

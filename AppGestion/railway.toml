# Railway: Root Directory = AppGestion (este archivo + pom padre).
# El packager de Railway hace COPY sobre /app/target; en monorepo el JAR queda en api/target/, así que lo copiamos a target/.
# Si el root del repo en Railway es la raíz "Proyectos", usa: mkdir -p target && cp AppGestion/api/target/appgestion-api.jar target/

[build]
buildCommand = "mvn -B -Dmaven.test.skip=true package && mkdir -p target && cp api/target/appgestion-api.jar target/appgestion-api.jar"

[deploy]
# SEC-20: spring.profiles.default solo se aplica si NO hay SPRING_PROFILES_ACTIVE; asi un despliegue sin perfil
# explicito arranca en prod (RuntimeProfileGuard rechaza el arranque en la nube sin el perfil prod).
startCommand = "java -Dspring.profiles.default=prod -jar target/appgestion-api.jar"
